# Local core stack: Postgres + Go Air API.
# docker compose -f docker-compose.local.yml -f docker-compose.local.override.yml -p nevarix-core up -d --force-recreate
name: nevarix-core
services:
  nevarix-core-pgsql:
    image: postgres:16-alpine
    container_name: nevarix-core-pgsql
    restart: "no"
    environment:
      POSTGRES_USER: nevarix
      POSTGRES_PASSWORD: nevarix
      POSTGRES_DB: nevarix
    ports:
      - "55432:5432"
    volumes:
      - nevarix-core-pgsql-data:/var/lib/postgresql/data
    networks:
      - app_net

  nevarix-core-api:
    image: golang:1.26-alpine
    container_name: nevarix-core-api
    restart: "no"
    working_dir: /app
    environment:
      HTTP_ADDR: "0.0.0.0:8090"
      GRPC_ADDR: "0.0.0.0:50051"
      DATABASE_URL: postgres://nevarix:nevarix@nevarix-core-pgsql:5432/nevarix?sslmode=disable
      AGENT_INGEST_TOKEN: change-me
      CORS_ORIGINS: http://localhost:5183,http://127.0.0.1:5183,http://localhost:5173,http://127.0.0.1:5173
      METRICS_HISTORY_POINTS: "60"
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev docker-cli && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - nevarix-gomod:/go/pkg/mod
      - nevarix-gotmp:/app/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8181:8090"
      - "50051:50051"
    depends_on:
      nevarix-core-pgsql:
        condition: service_started
    networks:
      - app_net

volumes:
  nevarix-core-pgsql-data:
  nevarix-gomod:
  nevarix-gotmp:

networks:
  app_net:
    name: ${DOCKER_NETWORK:-nevarix-net}
    external: true
