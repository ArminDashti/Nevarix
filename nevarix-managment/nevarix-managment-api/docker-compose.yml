name: nevarix

services:
  softether:
    image: softethervpn/vpnserver:latest
    container_name: nevarix-softether
    restart: "no"
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      PSK: nevarix
      USERNAME: nevarix
      PASSWORD: nevarix
      SPW: nevarix
      HPW: nevarix
    volumes:
      - nevarix-softether-data:/usr/vpnserver
    networks:
      - app_net

  nevarix-api:
    image: ${IMAGE_TAG:-nevarix-api:latest}
    container_name: nevarix-api
    restart: "no"
    environment:
      HTTP_ADDR: "0.0.0.0:${INTERNAL_PORT:-8090}"
      SQLITE_PATH: /app/data/managment.db
      HUB_URL: ${HUB_URL:-http://nevarix-hub:8091}
      HUB_INGEST_TOKEN: ${HUB_INGEST_TOKEN:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5184,http://127.0.0.1:5184,http://localhost:5173,http://127.0.0.1:5173}
      SOFTETHER_CONTAINER: nevarix-softether
      SOFTETHER_PASSWORD: nevarix
      SOFTETHER_HUB: DEFAULT
      SOFTETHER_ENABLED: "true"
      METRICS_HISTORY_POINTS: "60"
      SOFTETHER_POLL_SECONDS: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nevarix-managment-data:/app/data
    expose:
      - "${INTERNAL_PORT:-8090}"
    ports:
      - target: ${INTERNAL_PORT:-8090}
        published: ${PUBLISH_PORT-8181}
        protocol: tcp
    depends_on:
      softether:
        condition: service_started
    networks:
      - app_net

volumes:
  nevarix-managment-data:
    name: nevarix-managment-data
  nevarix-softether-data:
    name: nevarix-softether-data

networks:
  app_net:
    name: ${DOCKER_NETWORK:-nevarix-net}
    external: true