server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /nevarix/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /nevarix/index.html;
    }

    location = /nevarix {
        return 301 /nevarix/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}